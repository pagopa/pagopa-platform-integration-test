##############################################################################
# tas-example-ado-using-template.yml
#
# Example Azure DevOps pipeline showing how to integrate the
# Test Automation Service via the official ADO template.
#
# This is the recommended way to integrate from ADO: the caller only
# declares the parameters and consumes the standardised outputs.
# All boilerplate (Python setup, orchestrator download, secret handling,
# JSON dispatch, output normalisation) lives inside the template.
#
# ── Prerequisites ───────────────────────────────────────────────────────────
# 1. A GitHub PAT (scopes public_repo + actions:read) made available to this
#    pipeline as a SECRET variable, then forwarded to the template through the
#    'githubToken' parameter. Define it as a secret pipeline variable (or a
#    secret from an Azure Key Vault–linked variable group) so it stays masked
#    in the logs — never hard-code the token in this YAML.
#
# 2. A 'GitHub' service connection (Project settings → Service connections)
#    pointing to github.com. The name of the connection goes into
#    'resources.repositories[].endpoint' below.
##############################################################################

trigger: none
pr: none

parameters:
  - name: testType
    displayName: "Test category"
    type: string
    default: integration
    values: [integration, e2e, api]
  - name: suite
    displayName: "Test suite"
    type: string
    default: tas_pass
  - name: environment
    displayName: "Target environment"
    type: string
    default: uat
    values: [dev, uat]
  - name: mode
    displayName: "Invocation mode"
    type: string
    default: sync
    values: [sync, async, raw]
  - name: ref
    displayName: "TAS repo branch/tag"
    type: string
    default: main
  - name: tags
    displayName: "Behave tag expression (e.g. @runnable, @e2e); empty = workflow default (@runnable)"
    type: string
    default: ""
  - name: allure
    displayName: "Also produce Allure results (allure-results/) in the artifact"
    type: boolean
    default: false
  - name: verifyOrchestrator
    displayName: "Verify tas_orchestrator.py SHA-256 integrity (recommended)"
    type: boolean
    default: true
  - name: publishTests
    displayName: "Publish JUnit results to the 'Tests' tab (sync only)"
    type: boolean
    default: true
  - name: stepName
    displayName: "Output publishing step name (prefix for the output variables)"
    type: string
    default: tas

# ── Remote template source ──────────────────────────────────────────────────
# 'tas' is a logical alias used in the 'template:' directive below.
#
# IMPORTANT — two distinct 'ref' values are involved, do not confuse them:
#   • resources.repositories[].ref (here)  → branch/tag of the repo that HOSTS
#     the template YAML (where ADO fetches the template file from).
#   • parameters.ref (in the 'template:' block below) → branch of the TAS repo
#     (pagopa-platform-integration-test) the tests actually run from.
#
# Use the full form: refs/heads/<branch> for a branch, refs/tags/<tag> for a tag
# (a bare branch name does not resolve reliably for ADO repository resources).
resources:
  repositories:
    - repository: tas
      type: github
      name: pagopa/azure-pipeline-templates
      ref: refs/tags/tas-integration-tests/v1   # template repo branch (→ refs/tags/tas-integration-test/v1 or refs/heads/main)
      endpoint: pagoPA-projects   # ← GitHub service connection name (Project settings → Service connections)

stages:
  # ── Stage 0: Deploy to DEV ───────────────────────────────────
  # Runs first. Demonstrates that the TAS tests can now be gated on an
  # upstream stage: because the template is a STEPS template wrapped in a
  # stage you own, you are free to add `dependsOn` on the TAS stage below
  # (this was impossible with the previous stages-based template).
  - stage: DeployDev
    displayName: "Deploy to DEV"
    jobs:
      - job: DeployDevApp
        displayName: "Deploy application to DEV"
        pool:
          vmImage: ubuntu-latest
        steps:
          - script: echo "Deploying application to DEV..."
            displayName: "Deploy to DEV step"

  # ── Stage 1: Integration tests ──────────────────────────────────
  # The template is a STEPS template, so you wrap it in a stage/job you own.
  # This gives you full control over the stage name and its `dependsOn`
  # (here we gate the tests on the DEV deploy above), and lets you invoke the
  # template more than once in the same pipeline (e.g. one job for e2e and one
  # for integration) — the only rule is that each stage/job name is unique.
  - stage: TAS_IntegrationTests
    displayName: "TAS integration tests"
    dependsOn: DeployDev            # ← gate the tests on the DEV deploy stage above
    condition: succeeded()
    jobs:
      - job: RunTAS
        displayName: "Run TAS"
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: templates/qa-tas/tas-integration-test.yml@tas
            parameters:
              testType:           ${{ parameters.testType }}
              suite:              ${{ parameters.suite }}
              environment:        ${{ parameters.environment }}
              mode:               ${{ parameters.mode }}
              ref:                ${{ parameters.ref }}
              verifyOrchestrator: ${{ parameters.verifyOrchestrator }}
              publishTests:       ${{ parameters.publishTests }}
              # Behave tag filter. Leave empty to keep the workflow default
              # (@runnable, used by the integration suites). Override to target
              # other suites, e.g. 'tags: @e2e' for the e2e checkout suite.
              tags:               ${{ parameters.tags }}
              # Also emit an Allure results directory (allure-results/) inside
              # the artifact. In sync mode it is extracted under ARTIFACT_DIR;
              # rendering it to HTML is left to the caller (allure generate).
              allure:             ${{ parameters.allure }}
              # GitHub PAT forwarded to the orchestrator as TAS_GITHUB_TOKEN.
              # Source it from a SECRET pipeline variable (here
              # 'INTEGRATION_TEST_PAT') so it is masked in the logs — do not
              # paste the raw token into this file.
              githubToken:        $(INTEGRATION_TEST_PAT)
              # Name of the publishing step; also the prefix used to read the
              # output variables in Stage 2 below. Override it when you invoke
              # the template more than once in the SAME job (each step name
              # must be unique).
              stepName:           ${{ parameters.stepName }}
              # Optional overrides — exposed inline because they are typically
              # set-once-and-forget (not toggled from the portal at run-time):
              # pythonVersion: "3.11"
              # testRunTitle:  ""    # default — auto-generated as "TAS — <suite> / <env> (<ref>)"
              #
              # Supply-chain integrity, pinned mode (true SRI). When set, the
              # sidecar verification is replaced by a check against this digest.
              # Compute it once against the version you trust and bake it in:
              #   curl -sSfL https://raw.githubusercontent.com/pagopa/pagopa-platform-integration-test/refs/tags/v1/scripts/tas_orchestrator.py | sha256sum
              # orchestratorSha256: "a68b6c43c98517352c6d182df4a97b67e33a94ed79ae56949b1f6e6a179b5fe1"

  # ── Stage 2: Deploy ───────────────────────────────────────────────────────
  # In sync mode, the tests job fails on test failure, so 'succeeded()' on the
  # TAS_IntegrationTests stage blocks the deploy. In async/raw modes the job
  # only reflects the dispatch outcome, so deploy proceeds in parallel.
  - stage: Deploy
    displayName: "Deploy"
    dependsOn: TAS_IntegrationTests
    condition: succeeded()
    jobs:
      - job: DeployApp
        displayName: "Deploy application"
        pool:
          vmImage: ubuntu-latest
        variables:
          # Output variables published by the template step (name = stepName,
          # default 'tas') inside the RunTAS job of the TAS_IntegrationTests
          # stage declared above. The compile-time ${{ parameters.stepName }}
          # keeps this path in sync with the stepName passed to the template:
          CORRELATION_ID: $[ stageDependencies.TAS_IntegrationTests.RunTAS.outputs['${{ parameters.stepName }}.CORRELATION_ID'] ]
          RUN_ID:         $[ stageDependencies.TAS_IntegrationTests.RunTAS.outputs['${{ parameters.stepName }}.RUN_ID'] ]
          RUN_URL:        $[ stageDependencies.TAS_IntegrationTests.RunTAS.outputs['${{ parameters.stepName }}.RUN_URL'] ]
        steps:
          - script: |
              echo "Correlation ID : $(CORRELATION_ID)"
              echo "Run ID         : $(RUN_ID)      # populated only in mode=sync"
              echo "Run URL        : $(RUN_URL)     # populated only in mode=sync"
              echo "Deploying application..."
            displayName: "Deploy step"

