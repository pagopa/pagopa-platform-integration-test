# Project conventions for Gherkin feature files.
language: it
regex_dialect: python_re
max_scenarios_per_file: 12
scenario_counting: definitions
filename:
  example: FEAT_001_FdR3_Aggiungi_pagamenti.feature
  regex: '^FEAT_(?P<feature_progressive>(?!000)[0-9]{3})_(?P<suite>[A-Za-z0-9]+)_(?P<feature>[A-Za-z0-9]+(?:_[A-Za-z0-9]+)*)\.feature$'
  regex_groups:
    feature_progressive: 
      description: 3-digit 0-padded progressive number starting from 001, identifying each feature file within its suite
    suite:
      case: canonical_suite_token_preserve_acronyms
      word_limit: 1
      description: canonical single-token suite name, preserving established acronym casing (for example FdR3)
    feature:
      case: initial_uppercase_preserve_spelling_and_acronyms
      word_limit: none
      description: underscore-separated feature slug starting uppercase; later words preserve established spelling (for example Aggiungi_pagamenti)
indentation:
  feature: 0
  scenario: 2
  steps: 4
  examples: 4
  table_rows: 6
  comments: 2
tags:
  fixed_tags:
    required: false
    scenario_labels:
      - "@smoke"
      - "@regression"
      - "@positive"
      - "@negative"
    mutually_exclusive_labels:
      - ["@positive", "@negative"]
  dynamic_tags:
    required: true
    feature_tag_example: "@fdr3_001_Aggiungi_pagamenti"
    scenario_tag_example: "@fdr3_001_01"
    feature_regex: '^@(?P<suite>[a-z0-9]+)_(?P<feature_progressive>(?!000)[0-9]{3})_(?P<short_feature>[A-Za-z0-9]+(?:_[A-Za-z0-9]+)*)$'
    scenario_regex: '^@(?P<suite>[a-z0-9]+)_(?P<feature_progressive>(?!000)[0-9]{3})_(?P<scenario_progressive>(?!00)[0-9]{2})$'
    regex_groups:
      feature_progressive: 
        description: exactly the same as in the filename
      suite:
        case: lowercase_canonical_suite_token
        word_limit: 1
        description: suite name from the filename, converted to lowercase (for example FdR3 becomes fdr3)
      short_feature:
        case: initial_uppercase_preserve_spelling_and_acronyms
        word_limit: 5
        description: short and synthetic feature slug, derived from the one in the filename
      scenario_progressive:
        description: 2-digit 0-padded identifier from 01; initially assigned in scenario order, stable on maintenance, unique within the file
tracking_comment:
  required: true
  regex: '^#[0-9]{10}$'
