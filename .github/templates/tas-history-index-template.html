<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Test Automation Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header class="bg-primary text-white text-center p-4">
    <h1>Report Test Automation Service</h1>
    <p class="mb-0">Storico delle esecuzioni pubblicate</p>
  </header>
  <main class="container py-4">
    {% if reports %}
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr><th scope="col">Esecuzione</th><th scope="col">Report</th></tr>
        </thead>
        <tbody>
          {% for report in reports %}
          <tr>
            <td>{{ report.timestamp }}</td>
            <td><a href="{{ report.link }}">Apri report</a></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <p class="text-muted">Nessun report disponibile.</p>
    {% endif %}
    <a href="../index.html">Torna alla dashboard</a>
  </main>
</body>
</html>
