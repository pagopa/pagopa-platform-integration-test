<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storico Test Automation Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header class="bg-primary text-white text-center p-5">
    <h1>Test Automation Service</h1>
    <p>Storico delle suite</p>
  </header>
  <main class="container py-5">
    <div class="row justify-content-center">
      {% for suite in suites %}
      <section class="col-md-5 text-center mb-4">
        <a href="{{ suite.link }}" class="btn btn-primary btn-lg">{{ suite.name }}</a>
      </section>
      {% else %}
      <p class="text-muted text-center">Nessuna suite disponibile.</p>
      {% endfor %}
    </div>
  </main>
   <section class="col-md-5 text-center mb-4">
        <a href="../index.html" class="btn btn-primary btn-lg">Dashboard Test di Integrazione</a>
   </section>
  <footer class="text-center text-muted pb-4">Test Automation Service</footer>
</body>
</html>
