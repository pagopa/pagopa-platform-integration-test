# Keeps .github/gherkin-manifest.yml and .github/gherkin-synopses.json aligned with src/ (PQ-845).
# The first job decides whether the sync is needed (D25); the second regenerates and pushes to main.
# Scripts: .github/scripts/gherkin_manifest_sync.py and .github/scripts/gherkin_synopsis.py.
name: Sync Gherkin manifest

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      force_synopses:
        description: 'Regenerate every synopsis that is not locked (use after a PROMPT_VERSION change)'
        required: false
        type: boolean
        default: false

# No permission at workflow level: each job declares its own below.
permissions: {}

concurrency:
  group: gherkin-manifest-sync
  cancel-in-progress: false

jobs:
  evaluate_trigger:
    name: Decide whether the sync is needed
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Checkout main
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: main
          fetch-depth: 1

      - name: Evaluate criteria
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          decide() {
            local run="$1"
            local reason="$2"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "- Gherkin manifest sync: run=$run, reason: $reason" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            decide true "manual run"
            exit 0
          fi

          for file in .github/gherkin-manifest.yml .github/gherkin-synopses.json; do
            if [ ! -f "$file" ]; then
              decide true "missing $file"
              exit 0
            fi
          done

          PR_FILES="$RUNNER_TEMP/pr-files.txt"
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$PR_FILES"; then
            decide true "PR file list not available"
            exit 0
          fi

          if grep -Eq '^(src/.+\.feature|\.github/gherkin-manifest\.yml|\.github/gherkin-synopses\.json)$' "$PR_FILES"; then
            decide true "the PR changes feature, manifest or synopsis files"
            exit 0
          fi

          decide false "no criterion met"

  sync_gherkin_manifest:
    name: Regenerate manifest and synopses
    needs: evaluate_trigger
    if: needs.evaluate_trigger.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Regenerate manifest
        shell: bash
        run: |
          python .github/scripts/gherkin_manifest_sync.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Copy of the model discovery in .github/workflows/ai-report-analysis.yml (D22).
      # If the fallback list changes there, change it here too.
      - name: Check fallback model availability
        id: catalog
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.REPORT_ANALYSIS_GEMINI_API_KEY }}
          BASE_URL: "https://generativelanguage.googleapis.com/v1beta"
        run: |
          echo "Calling GET $BASE_URL/models ..."
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "$BASE_URL/models?pageSize=1000")

          CANDIDATE_MODELS='[
            "gemini-3.6-flash",
            "gemini-3.5-flash-lite",
            "gemini-3.1-pro-preview",
            "gemini-2.5-pro"
          ]'
          AVAILABLE_MODELS=$(echo "$RESPONSE" | jq -c --argjson candidates "$CANDIDATE_MODELS" '
            [.models[]
              | select(.supportedGenerationMethods | index("generateContent"))
              | .name
              | sub("^models/"; "")
            ] as $catalog
            | [$candidates[] | select(. as $candidate | $catalog | index($candidate))]
          ')

          {
            echo "## Gemini fallback chain (synopses)"
            echo
            echo "$CANDIDATE_MODELS" | jq -r --argjson available "$AVAILABLE_MODELS" '
              .[] as $model
              | "- `\($model)`: \(if $available | index($model) then "available" else "unavailable" end)"
            '
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(echo "$AVAILABLE_MODELS" | jq 'length')" -eq 0 ]; then
            echo "None of the fallback models is available for generateContent" >&2
            exit 1
          fi

          MODEL_LIMITS=$(echo "$RESPONSE" | jq -c '
            [.models[]
              | {key: (.name | sub("^models/"; "")),
                 value: {input: (.inputTokenLimit // 0), output: (.outputTokenLimit // 0)}}
            ] | from_entries
          ')

          echo "Available fallback models: $AVAILABLE_MODELS"
          echo "available_models=$AVAILABLE_MODELS" >> "$GITHUB_OUTPUT"
          echo "model_limits=$MODEL_LIMITS" >> "$GITHUB_OUTPUT"

      - name: Regenerate synopses
        id: synopses
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.REPORT_ANALYSIS_GEMINI_API_KEY }}
          AVAILABLE_MODELS: ${{ steps.catalog.outputs.available_models }}
          MODEL_LIMITS: ${{ steps.catalog.outputs.model_limits }}
          FORCE_SYNOPSES: ${{ github.event.inputs.force_synopses || 'false' }}
        run: |
          args=()
          if [ "$FORCE_SYNOPSES" = "true" ]; then
            args+=(--force)
          fi
          python3 .github/scripts/gherkin_synopsis.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push when changed
        shell: bash
        run: |
          FILES=(.github/gherkin-manifest.yml .github/gherkin-synopses.json)
          if [ -z "$(git status --porcelain -- "${FILES[@]}")" ]; then
            echo "No change in the manifest or synopses: nothing to commit"
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              git add -- "$file"
            fi
          done
          git commit -m "chore: sync gherkin manifest and synopses"
          git pull --rebase origin main
          git push
