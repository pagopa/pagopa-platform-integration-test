name: Create Confluence Report Page

on:
    workflow_call:
        inputs:
            run_type:
                description: "Type of run"
                type: string
                required: true
                default: NO-PROMO
                

permissions:
    contents: read

jobs:
    create_report_page:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                    fetch-depth: 2
                    ref: ${{ github.ref }}

            - name: Download processed reports artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: processed-reports
                  path: .

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: 3.x

            - name: Install dependencies
              run: |
                    pip install --upgrade pip
                    pip install -r requirements.txt

            - name: Create Confluence Report Page
              env:
                  CONFLUENCE_KEY: ${{ secrets.CONFLUENCE_KEY }}
                  CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
              run: |
                  python3 .github/scripts/create_report_page.py --run-type "${{ inputs.run_type }}"
