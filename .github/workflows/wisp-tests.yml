name: Run WISP Integration Tests

on:
  workflow_call:

permissions:
  contents: read
  actions: write   # required by the nested ai-report-analysis.yml call

jobs:
  wisp_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get install -y jq

      - name: Load secrets
        run: echo "$SECRETS" >> ./config/.secrets.yaml
        env:
          SECRETS: ${{ secrets.INTEGRATION_TESTS_SECRETS }}

      - name: Run WISP tests
        id: run_tests
        continue-on-error: true
        env:
          TARGET_ENV: uat
          suite: wisp
        run: |
          behave src/integration/wisp --tags=@runnable --format allure_behave.formatter:AllureFormatter -o allure-results --junit-directory=junit --junit --summary --show-timings -v

      - name: Build AI analysis prompt
        if: always()
        env:
          ALLURE_RESULTS_DIR: allure-results
          PROMPT_OUTPUT: ai-analysis-input/prompt.txt
          SUITE_LABEL: WISP
        run: python3 .github/scripts/build_ai_prompt.py

      - name: Upload AI prompt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-prompt-wisp
          path: ai-analysis-input

      - name: Load previous allure history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare allure-results for report generation
        if: always()
        run: |
          # allure-behave may create allure-results/history as a plain file;
          # allure generate needs it to be a directory.
          if [ -f allure-results/history ]; then rm allure-results/history; fi
          mkdir -p allure-results/history
          RESULT_COUNT=$(find allure-results -maxdepth 1 -name '*-result.json' | wc -l)
          echo "::notice title=Allure results::${RESULT_COUNT} result file(s) in allure-results/"
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "::warning::No allure result files found — tests may have crashed before writing results."
          fi

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.27.0

      - name: Build WISP Allure report
        if: always()
        continue-on-error: true
        env:
          SUBFOLDER: wisp-tests
        run: |
          if [ -d "gh-pages/${SUBFOLDER}/last-history" ]; then
            echo "Loading previous history for trend charts..."
            cp -r "gh-pages/${SUBFOLDER}/last-history/." allure-results/history/
          fi
          allure generate allure-results --clean -o allure-report-wisp
          mkdir -p "allure-history/${SUBFOLDER}/${{ github.run_number }}"
          cp -r allure-report-wisp/. "allure-history/${SUBFOLDER}/${{ github.run_number }}/" || true
          mkdir -p "allure-history/${SUBFOLDER}/last-history"
          cp -r allure-report-wisp/history/. "allure-history/${SUBFOLDER}/last-history/" || true
          echo "Report generated: $(ls allure-report-wisp | wc -l) top-level entries"

      - name: Upload WISP report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allure-report-wisp
          path: allure-report-wisp
          if-no-files-found: warn
          
  ai-analysis:
    if: always()
    needs: wisp_tests
    uses: ./.github/workflows/ai-report-analysis.yml
    with:
      prompt_artifact: ai-prompt-wisp
      analysis_artifact_name: ai-analysis-wisp
      max_tokens: '16384'
    secrets: inherit
