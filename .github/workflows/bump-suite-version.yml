name: Bump test suite version

on:
    workflow_dispatch:
    pull_request: 
     types:
      - closed

permissions:
    contents: write
    pull-requests: read
    

jobs:
  bump_suite_version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}

      - name: Obtain labels
        id: labels
        uses: actions/github-script@d556feaca394842dc55e4734bf3bb9f685482fa0 # v6.3.3
        with:
          script: |
            const { verifyPullRequestLabels } = require('./.github/scripts/suite-version-labels.js');
            await verifyPullRequestLabels({ github, context, core });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Python
        if: steps.labels.outputs.should_bump == 'true'
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with: 
          python-version: '3.x'

      - name: Install dependencies
        if: steps.labels.outputs.should_bump == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests dynaconf 

      - name: Update test suite version
        if: steps.labels.outputs.should_bump == 'true'
        env:
          VERSION_LABEL: ${{ steps.labels.outputs.version_label }}
          SUITE_LABEL: ${{ steps.labels.outputs.suite_label }}
        run: |
            python -u .github/scripts/auto_update_test_suite_version.py -v "$VERSION_LABEL" -s "$SUITE_LABEL"
    
      - name: Push new versions file
        if: steps.labels.outputs.should_bump == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/nrt-suites.json
          git commit -m "Update test suite version"
          git push
