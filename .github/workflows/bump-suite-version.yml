name: Bump test suite version

on:
    workflow_dispatch:
    pull_request: 
     types:
      - closed

permissions:
    contents: write
    pull-requests: read
    

jobs:
  bump_suite_version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}

      - name: Obtain labels
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip') }}
        uses: actions/github-script@d556feaca394842dc55e4734bf3bb9f685482fa0 # v6.3.3
        with:
          script: |
            var labels = await github.rest.issues.listLabelsOnIssue({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo
            });

            const versionLabels = ['minor', 'major', 'patch']
            const suiteLabels = ['wisp','checkout','fdr']
            var versionLabel = null;
            var suiteLabel = null;
            for (const label of labels.data) {
                label.name = label.name.toLowerCase();
                if(versionLabels.includes(label.name)) {
                    versionLabel = label.name;
                    continue;
                }

                if(suiteLabels.includes(label.name)) {
                    suiteLabel = label.name;
                    continue;
                }
            }
            console.log(`Detected version label: ${versionLabel}, suite label: ${suiteLabel}`)
            core.exportVariable('VERSION_LABEL', versionLabel);
            core.exportVariable('SUITE_LABEL', suiteLabel);
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Python
        if: ${{ env.VERSION_LABEL && env.SUITE_LABEL }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with: 
          python-version: '3.x'

      - name: Install dependencies
        if: ${{ env.VERSION_LABEL && env.SUITE_LABEL }}
        run: |
          python -m pip install --upgrade pip
          pip install requests dynaconf 

      - name: Update test suite version
        if: ${{ env.VERSION_LABEL && env.SUITE_LABEL }}
        run: |
            python -u .github/scripts/auto_update_test_suite_version.py -v "${{ env.VERSION_LABEL }}" -s "${{ env.SUITE_LABEL }}"
    
      - name: Push new versions file
        if: ${{ env.VERSION_LABEL && env.SUITE_LABEL }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add suite_versions.json
          git commit -m "Update test suite version"
          git push