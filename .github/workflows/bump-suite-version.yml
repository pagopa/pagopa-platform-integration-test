name: Bump test suite version

on:
    workflow_dispatch:
    pull_request: 
     types:
      - closed

permissions:
    contents: write
    pull-requests: write
    

jobs:
  bump_suite_version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.ref }}

      - name: Obtain labels
        id: labels
        uses: actions/github-script@d556feaca394842dc55e4734bf3bb9f685482fa0 # v6.3.3
        with:
          script: |
            const { verifyPullRequestLabels } = require('./.github/scripts/suite-version-labels.js');
            await verifyPullRequestLabels({ github, context, core });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Python
        if: steps.labels.outputs.should_bump == 'true'
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with: 
          python-version: '3.x'

      - name: Install dependencies
        if: steps.labels.outputs.should_bump == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests dynaconf 

      - name: Update test suite version
        if: steps.labels.outputs.should_bump == 'true'
        env:
          VERSION_LABEL: ${{ steps.labels.outputs.version_label }}
          SUITE_LABEL: ${{ steps.labels.outputs.suite_label }}
        run: |
            python -u .github/scripts/auto_update_test_suite_version.py -v "$VERSION_LABEL" -s "$SUITE_LABEL"
    
      - name: Prepare version bump PR description
        id: bump_pr
        if: steps.labels.outputs.should_bump == 'true'
        uses: actions/github-script@d556feaca394842dc55e4734bf3bb9f685482fa0 # v6.3.3
        env:
          SUITE_LABEL: ${{ steps.labels.outputs.suite_label }}
          VERSION_LABEL: ${{ steps.labels.outputs.version_label }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/PULL_REQUEST_TEMPLATE.md', 'utf8')
              .replace('<!--- Describe your changes in detail -->',
                `$&\n\nApply a ${process.env.VERSION_LABEL} version bump to the ${process.env.SUITE_LABEL} suite in \`.github/nrt-suites.json\`.`)
              .replace('<!--- Why is this change required? What problem does it solve? -->',
                `$&\n\nFollow-up to #${context.issue.number}. Submit the catalog update for review instead of pushing directly to protected main. The skip label prevents a recursive suite version bump.`)
              .replace('<!--- your change affects other areas of the code, etc. -->',
                '$&\n\nNo tests were run by this workflow. Only the suite version in the NRT catalog was updated automatically.')
              .replace('- [ ] Bug fix', '- [x] Bug fix');
            core.setOutput('body', body);

      - name: Create version bump pull request
        if: steps.labels.outputs.should_bump == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: .github/nrt-suites.json
          base: main
          branch: auto-bump-suite-version/${{ github.event.pull_request.number }}
          commit-message: Auto bump ${{ steps.labels.outputs.suite_label }} version
          title: Auto bump ${{ steps.labels.outputs.suite_label }} version
          body: ${{ steps.bump_pr.outputs.body }}
          labels: skip
