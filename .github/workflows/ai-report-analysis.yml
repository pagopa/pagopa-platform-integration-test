name: 🤖 AI Report Analysis

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt to send to the AI model'
        required: false
        default: 'di che colore era il cavallo bianco di napoleone?'
      prompt_artifact:
        description: 'Artifact name containing prompt.txt (optional, overrides prompt)'
        required: false
        default: ''
      analysis_artifact_name:
        description: 'Name of the output artifact containing response.json and analysis.md'
        required: false
        default: ''
      max_tokens:
        description: 'Max output tokens'
        required: false
        default: '32'
  workflow_call:
    inputs:
      prompt:
        description: 'Prompt string (ignored if prompt_artifact is provided)'
        required: false
        type: string
        default: ''
      prompt_artifact:
        description: 'Name of an artifact containing prompt.txt to use as prompt'
        required: false
        type: string
        default: ''
      analysis_artifact_name:
        description: 'Name of the artifact to upload with the model response'
        required: false
        type: string
        default: ''
      max_tokens:
        description: 'Max output tokens'
        required: false
        type: string
        default: '32'

permissions:
  contents: read
  actions: write

env:
  BASE_URL: "https://generativelanguage.googleapis.com/v1beta"

jobs:
  check-model-catalog:
    name: "Discover Gemini fallback models"
    runs-on: ubuntu-latest
    outputs:
      available_models: ${{ steps.check.outputs.available_models }}
    steps:
      - name: Check fallback model availability
        id: check
        env:
          GEMINI_API_KEY: ${{ secrets.REPORT_ANALYSIS_GEMINI_API_KEY }}
        run: |
          echo "Calling GET $BASE_URL/models ..."
          RESPONSE=$(curl --silent --show-error --fail-with-body \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            "$BASE_URL/models?pageSize=1000")

          CANDIDATE_MODELS='[
            "gemini-3.6-flash",
            "gemini-3.5-flash-lite",
            "gemini-3.1-pro-preview",
            "gemini-2.5-pro"
          ]'
          AVAILABLE_MODELS=$(echo "$RESPONSE" | jq -c --argjson candidates "$CANDIDATE_MODELS" '
            [.models[]
              | select(.supportedGenerationMethods | index("generateContent"))
              | .name
              | sub("^models/"; "")
            ] as $catalog
            | [$candidates[] | select(. as $candidate | $catalog | index($candidate))]
          ')

          {
            echo "## Gemini fallback chain"
            echo
            echo "$CANDIDATE_MODELS" | jq -r --argjson available "$AVAILABLE_MODELS" '
              .[] as $model
              | "- `\($model)`: \(if $available | index($model) then "available" else "unavailable" end)"
            '
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(echo "$AVAILABLE_MODELS" | jq 'length')" -eq 0 ]; then
            echo "None of the fallback models is available for generateContent" >&2
            exit 1
          fi

          echo "Available fallback models: $AVAILABLE_MODELS"
          echo "available_models=$AVAILABLE_MODELS" >> "$GITHUB_OUTPUT"

  call-inference:
    name: "Call Gemini inference endpoint"
    needs: check-model-catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download prompt artifact
        if: ${{ inputs.prompt_artifact != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.prompt_artifact }}
          path: ai-prompt-input

      - name: Resolve prompt
        env:
          INPUT_PROMPT: ${{ inputs.prompt }}
          PROMPT_ARTIFACT: ${{ inputs.prompt_artifact }}
        run: |
          mkdir -p ai-analysis-output
          if [ -n "$PROMPT_ARTIFACT" ] && [ -f "ai-prompt-input/prompt.txt" ]; then
            echo "Using prompt from artifact '$PROMPT_ARTIFACT'"
            cp ai-prompt-input/prompt.txt ai-analysis-output/prompt.txt
          elif [ -n "$INPUT_PROMPT" ]; then
            echo "Using prompt from input"
            printf '%s' "$INPUT_PROMPT" > ai-analysis-output/prompt.txt
          else
            echo "Using default prompt"
            printf '%s' "di che colore era il cavallo bianco di napoleone?" > ai-analysis-output/prompt.txt
          fi
          echo "Prompt size (chars): $(wc -c < ai-analysis-output/prompt.txt)"

      - name: Generate analysis with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.REPORT_ANALYSIS_GEMINI_API_KEY }}
          AVAILABLE_MODELS: ${{ needs.check-model-catalog.outputs.available_models }}
          MAX_TOKENS: ${{ inputs.max_tokens || '32' }}
        run: |
          python3 .github/scripts/gemini_analysis.py \
            --prompt-file ai-analysis-output/prompt.txt \
            --output-dir ai-analysis-output \
            --max-output-tokens "$MAX_TOKENS"

      - name: Upload analysis artifact
        if: ${{ inputs.analysis_artifact_name != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.analysis_artifact_name }}
          path: ai-analysis-output
