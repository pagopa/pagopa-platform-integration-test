name: 🔁 NRT - Run Suite

on:
  workflow_call:
    inputs:
      suite_id:
        required: true
        type: string
      suite_label:
        required: true
        type: string
      behave_path:
        required: true
        type: string
      tags_json:
        required: true
        type: string
      allure_subfolder:
        required: true
        type: string
      report_artifact:
        required: true
        type: string
      secret_set:
        required: true
        type: string
      needs_playwright:
        required: true
        type: boolean
      target_env:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run_suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUITE_ID: ${{ inputs.suite_id }}
      SUITE_LABEL: ${{ inputs.suite_label }}
      TARGET_ENV: ${{ inputs.target_env }}
      BEHAVE_PATH: ${{ inputs.behave_path }}
      TAGS_JSON: ${{ inputs.tags_json }}
      SUBFOLDER: ${{ inputs.allure_subfolder }}-${{ inputs.target_env }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        id: checkout

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        id: install_dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        if: inputs.needs_playwright
        id: playwright_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0

      - name: Install Playwright
        if: inputs.needs_playwright
        id: install_playwright
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chrome

      - name: Load integration secrets
        if: inputs.secret_set == 'integration'
        id: load_integration_secrets
        env:
          SECRETS: ${{ secrets.INTEGRATION_TESTS_SECRETS }}
        run: |
          if [ -z "$SECRETS" ]; then
            echo 'INTEGRATION_TESTS_SECRETS is empty.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SECRETS" > config/.secrets.yaml

      - name: Load checkout secrets
        if: inputs.secret_set == 'checkout'
        id: load_checkout_secrets
        env:
          SECRETS: ${{ secrets.CHECKOUT_TESTS_SECRETS }}
        run: |
          if [ -z "$SECRETS" ]; then
            echo 'CHECKOUT_TESTS_SECRETS is empty.' >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$SECRETS" > config/.secrets.yaml

      - name: Run Behave tests
        id: run_tests
        continue-on-error: true
        env:
          HEADLESS: 'true'
          suite: ${{ inputs.suite_id }}
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.[]' <<< "$TAGS_JSON")
          command=(behave "$BEHAVE_PATH")
          for tag in "${tags[@]}"; do
            command+=(--tags="$tag")
          done
          command+=(
            --format allure_behave.formatter:AllureFormatter
            -o allure-results
            --junit-directory=junit
            --junit
            --summary
            --show-timings
            -v
          )
          "${command[@]}"

      - name: Build suite AI prompt
        if: always()
        id: build_ai_prompt
        env:
          ALLURE_RESULTS_DIR: allure-results
          JUNIT_RESULTS_DIR: junit
          PROMPT_OUTPUT: ai-analysis-input/prompt.txt
          SUITE_LABEL: ${{ inputs.suite_label }}
        run: python3 .github/scripts/build_ai_prompt.py

      - name: Name suite AI prompt
        if: always()
        run: cp ai-analysis-input/prompt.txt "ai-analysis-input/${SUITE_ID}.txt"

      - name: Upload suite AI prompt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nrt-ai-prompt-${{ inputs.suite_id }}
          path: ai-analysis-input/${{ inputs.suite_id }}.txt
          if-no-files-found: warn

      - name: Load previous Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1
          sparse-checkout: ${{ inputs.allure_subfolder }}-${{ inputs.target_env }}/last-history

      - name: Prepare Allure results
        if: always()
        run: |
          if [ -f allure-results/history ]; then rm allure-results/history; fi
          mkdir -p allure-results/history
          result_count=$(find allure-results -maxdepth 1 -name '*-result.json' | wc -l)
          echo "Found $result_count Allure result file(s)."

      - name: Install Allure CLI
        if: always()
        id: install_allure
        run: |
          npm install --prefix "$RUNNER_TEMP/allure" --no-save --no-package-lock allure-commandline@2.27.0
          echo "$RUNNER_TEMP/allure/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build Allure report
        if: always()
        id: build_report
        continue-on-error: true
        run: |
          history_dir="gh-pages/${SUBFOLDER}/last-history"
          if [ -d "$history_dir" ]; then
            cp -r "$history_dir/." allure-results/history/
          fi
          allure generate allure-results --clean -o allure-report
          mkdir -p "allure-history/${SUBFOLDER}/${{ github.run_number }}"
          cp -r allure-report/. "allure-history/${SUBFOLDER}/${{ github.run_number }}/" || true
          mkdir -p "allure-history/${SUBFOLDER}/last-history"
          cp -r allure-report/history/. "allure-history/${SUBFOLDER}/last-history/" || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.report_artifact }}
          path: allure-report
          if-no-files-found: warn

      - name: Write suite outcome
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          JAVA_OUTCOME: ${{ steps.setup_java.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.install_dependencies.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.install_playwright.outcome }}
          INTEGRATION_SECRETS_OUTCOME: ${{ steps.load_integration_secrets.outcome }}
          CHECKOUT_SECRETS_OUTCOME: ${{ steps.load_checkout_secrets.outcome }}
          AI_PROMPT_OUTCOME: ${{ steps.build_ai_prompt.outcome }}
          ALLURE_OUTCOME: ${{ steps.install_allure.outcome }}
          REPORT_OUTCOME: ${{ steps.build_report.outcome }}
        run: |
          job_outcome=success
          for outcome in \
            "$CHECKOUT_OUTCOME" \
            "$PYTHON_OUTCOME" \
            "$JAVA_OUTCOME" \
            "$DEPENDENCIES_OUTCOME" \
            "$PLAYWRIGHT_OUTCOME" \
            "$INTEGRATION_SECRETS_OUTCOME" \
            "$CHECKOUT_SECRETS_OUTCOME" \
            "$TEST_OUTCOME" \
            "$AI_PROMPT_OUTCOME" \
            "$ALLURE_OUTCOME" \
            "$REPORT_OUTCOME"; do
            if [ "$outcome" = failure ] || [ "$outcome" = cancelled ]; then
              job_outcome=failure
            fi
          done
          mkdir -p nrt-outcome
          jq -n \
            --arg suite_id "$SUITE_ID" \
            --arg target_env "$TARGET_ENV" \
            --arg test_outcome "${TEST_OUTCOME:-skipped}" \
            --arg job_outcome "$job_outcome" \
            '{suite_id: $suite_id, target_env: $target_env, test_outcome: $test_outcome, job_outcome: $job_outcome}' \
            > "nrt-outcome/${SUITE_ID}.json"

      - name: Upload suite outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nrt-outcome-${{ inputs.suite_id }}
          path: nrt-outcome/${{ inputs.suite_id }}.json
          if-no-files-found: error

      - name: Remove plaintext secrets
        if: always()
        run: rm -f config/.secrets.yaml