name: 🔐 NRT - Sync Secrets

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment bundle to refresh
        required: true
        type: choice
        default: all
        options:
          - all
          - dev
          - uat

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    env:
      TARGET_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'all' }}
    steps:
      - name: Select environments to synchronize
        id: targets
        shell: bash
        run: |
          matrix=$(jq -cn --arg selected "$TARGET_SELECTION" '
            [
              {target_env:"dev", short_env:"d"},
              {target_env:"uat", short_env:"u"}
            ]
            | map(select($selected == "all" or .target_env == $selected))
            | {include: .}
          ')
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  sync_secrets:
    name: Sync NRT secrets - ${{ matrix.target_env }}
    needs: prepare
    runs-on: [self-hosted-job, "${{ matrix.target_env }}"]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: nrt-secrets-sync-${{ matrix.target_env }}
      cancel-in-progress: false
    env:
      AZURE_KEY_VAULT_URL: https://pagopa-${{ matrix.short_env }}-itn-qa-kv.vault.azure.net/
      TARGET_ENV: ${{ matrix.target_env }}
      NRT_GITHUB_REPOSITORY: ${{ github.repository }}
      NRT_GITHUB_API_URL: ${{ github.api_url }}
      NRT_BUNDLE_SECRET_NAME: NRT_SECRETS_BUNDLE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: Install sync dependencies
        run: python -m pip install azure-identity azure-keyvault-secrets azure-mgmt-apimanagement PyNaCl requests dynaconf

      - name: Build and publish environment secret bundle
        run: python .github/scripts/nrt-sync-secrets.py

  notify_failure:
    name: Notify secret sync failure
    if: always() && needs.sync_secrets.result == 'failure'
    needs: [sync_secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INTEGRATION_TEST_WEBHOOK_URL }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SELECTION: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'all (scheduled)' }}
        shell: bash
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo 'SLACK_INTEGRATION_TEST_WEBHOOK_URL is not configured.' >&2
            exit 1
          fi

          payload=$(jq -cn \
            --arg selection "$TARGET_SELECTION" \
            --arg url "$WORKFLOW_URL" \
            '{text:("⚠️ NRT secret sync failed for " + $selection + ". The last published bundle remains in place. <" + $url + "|Open workflow run>.")}')
          curl --silent --show-error --fail-with-body --max-time 20 \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"