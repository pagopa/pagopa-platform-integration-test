name: Main Dispatch Integration Tests

on:
  schedule:
    - cron: '17 6 * * *'
    
  workflow_dispatch:
    inputs:
      services:
        description: "Select which services to test"
        required: true
        type: choice
        default: all
        options:
          - wisp
          - checkout
          # - fdr
          - all

jobs:
  trigger_wisp:
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.services == 'wisp' || github.event.inputs.services == 'all'
    # wisp-tests.yml calls ai-report-analysis.yml, which requires 'actions: write'.
    # Down a reusable-workflow chain permissions can only be reduced, never elevated,
    # so the top-level caller must grant it here.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/wisp-tests.yml
    secrets: inherit

  trigger_checkout_e2e:
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.services == 'checkout' || github.event.inputs.services == 'all'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/checkout-e2e-tests.yml
    secrets: inherit

  # trigger_fdr:
  #   if: |
  #     github.event_name == 'schedule' ||
  #     github.event.inputs.services == 'fdr' || github.event.inputs.services == 'all'
  #   uses: ./.github/workflows/fdr-tests.yml
  #   secrets: inherit


  deploy:
    if: always()
    # deploy-test-report.yml pushes to gh-pages via peaceiris (needs contents: write)
    # and downloads run artifacts (needs actions: read)
    needs: [trigger_wisp, trigger_checkout_e2e]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/deploy-test-report.yml
    secrets: inherit

  create_confluence_report:
    if: always()
    needs: [deploy]
    uses: ./.github/workflows/create_report_page.yml
    secrets: inherit
    with:
      run_type: ${{ case(github.event_name == 'schedule',  'NIGHTLY', 'NO-PROMO') }}
