name: Run FdR Integration Tests

on:
  workflow_call:

jobs:
  fdr_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get install -y jq

      - name: Run FdR tests
        id: run_tests
        continue-on-error: true
        run: |
          behave src/integration/fdr --tags=@runnable --format allure_behave.formatter:AllureFormatter -o allure-results --junit-directory=junit --junit --summary --show-timings -v

      - name: Load previous allure history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare allure-results for report generation
        if: always()
        run: |
          if [ -f allure-results/history ]; then rm allure-results/history; fi
          mkdir -p allure-results/history
          RESULT_COUNT=$(find allure-results -maxdepth 1 -name '*-result.json' | wc -l)
          echo "::notice title=Allure results::${RESULT_COUNT} result file(s) in allure-results/"
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "::warning::No allure result files found — tests may have crashed before writing results."
          fi

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline@2.27.0

      - name: Build FdR Allure report
        if: always()
        continue-on-error: true
        env:
          SUBFOLDER: fdr-tests
        run: |
          if [ -d "gh-pages/${SUBFOLDER}/last-history" ]; then
            echo "Loading previous history for trend charts..."
            cp -r "gh-pages/${SUBFOLDER}/last-history/." allure-results/history/
          fi
          allure generate allure-results --clean -o allure-report-fdr
          mkdir -p "allure-history/${SUBFOLDER}/${{ github.run_number }}"
          cp -r allure-report-fdr/. "allure-history/${SUBFOLDER}/${{ github.run_number }}/" || true
          mkdir -p "allure-history/${SUBFOLDER}/last-history"
          cp -r allure-report-fdr/history/. "allure-history/${SUBFOLDER}/last-history/" || true
          echo "Report generated: $(ls allure-report-fdr | wc -l) top-level entries"

      - name: Upload FdR report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allure-report-fdr
          path: allure-report-fdr
          if-no-files-found: warn
