name: NRT - Verify Secrets

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: GitHub Environment bundle to verify against Key Vault
        required: true
        type: choice
        default: dev
        options:
          - dev
          - uat

permissions:
  contents: read

jobs:
  verify_secrets:
    name: Verify NRT secrets - ${{ inputs.target_env }}
    runs-on: [self-hosted-job, "${{ inputs.target_env }}"]
    environment: ${{ inputs.target_env }}
    timeout-minutes: 20
    concurrency:
      group: nrt-secrets-sync-${{ inputs.target_env }}
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      AZURE_KEY_VAULT_URL: https://pagopa-${{ inputs.target_env == 'dev' && 'd' || 'u' }}-itn-qa-kv.vault.azure.net/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x

      - name: Install verification dependencies
        run: python -m pip install azure-identity azure-keyvault-secrets azure-mgmt-apimanagement PyNaCl requests dynaconf

      - name: Verify published environment bundle
        env:
          NRT_SECRETS_BUNDLE: ${{ secrets.NRT_SECRETS_BUNDLE }}
        run: python .github/scripts/nrt-sync-secrets.py --verify