name: Test Data Ingestion on database

on:
    workflow_call:
      inputs:
        env:
          required: true
          type: string
          default: UAT
        run_type:
          required: true
          type: string
          default: CRON
        test_object:
          required: false
          type: string
        test_type:
          required: false
          type: string

permissions:
    contents: read

jobs:
    test_data_ingestion:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                    fetch-depth: 2
                    ref: ${{ github.ref }}

            - name: Download processed reports artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: tmp_processed_reports
                  path: artifacts
            - run: ls -R artifacts

            - name: Setup Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: 3.x

            - name: Install dependencies
              run: |
                    pip install --upgrade pip
                    pip install -r requirements.txt

            - name: Load secrets
              run: echo "$SECRETS" >> ./config/.secrets.yaml
              env:
                  SECRETS: ${{ secrets.QA_HUB_API_KEYS }}
            - name: Populate test data in database
              run: |
                  python3 .github/scripts/populate_tables.py --env "${{ inputs.env }}" --run-type "${{ inputs.run_type }}"
