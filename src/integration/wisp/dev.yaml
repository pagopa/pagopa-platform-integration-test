NUOVA_CONNETTIVITA_SUBSCRIPTION_KEY: "$tas-nuova-connettivita-subscription-key"
NODO_SUBSCRIPTION_KEY: "$tas-nodo-subscription-key"
TECHNICAL_SUPPORT_SUBSCRIPTION_KEY: "$tas-technical-support-subscription-key"
GPD_SUBSCRIPTION_KEY: "$tas-gpd-subscription-key"
CHANNEL_WISP_PASSWORD: "$tas-channel-wisp-password"
CHANNEL_WFESP_PASSWORD: "$tas-channel-wfesp-password"
CHANNEL_CHECKOUT_PASSWORD: "$tas-channel-checkout-password"
STATION_PASSWORD: "$tas-station-password"

services:
    nodo_per_pa:
      url: https://api.dev.platform.pagopa.it/nodo-auth/nodo-per-pa/v1
      subscription_key: FORWARDER_SUBSCRIPTION_KEY
    node_for_psp:
      url: https://api.dev.platform.pagopa.it/nodo/node-for-psp/v1
      subscription_key: NODO_SUBSCRIPTION_KEY
    nodo_per_pm_v1:
      url: https://api.dev.platform.pagopa.it/nodo/nodo-per-pm/v1
      subscription_key: NODO_SUBSCRIPTION_KEY
    nodo_per_pm_v2:
      url: https://api.dev.platform.pagopa.it/nodo/nodo-per-pm/v2
      subscription_key: TEST_NODO_SUBSCRIPTION_KEY
    gpd_core:
      url: https://api.dev.platform.pagopa.it/gpd/api/v2
      subscription_key: GPD_SUBSCRIPTION_KEY
    wisp_converter:
      url: https://dev.wisp2.pagopa.it/wisp-converter/redirect/api/v1
      healthcheck: /info
    technical_support:
      url: https://api.dev.platform.pagopa.it/technical-support/wisp-converter/api/v1
      subscription_key: TECHNICAL_SUPPORT_SUBSCRIPTION_KEY
      healthcheck: /info
    cup_mock:
      url: https://api.dev.platform.pagopa.it/mock-ec-primary/service/v1/mock
      soap_action: paDemandPaymentNotice
    gpd:
      url: https://api.dev.platform.pagopa.it/gpd/api/v1
      subscription_key: GPD_SUBSCRIPTION_KEY
    gpd_external:
      url: https://api.dev.platform.pagopa.it/gpd/debt-positions-service/v1
      subscription_key: GPD_SUBSCRIPTION_KEY
